<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FAIZ Delivery</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:#f5f5f6;color:#212529;min-height:100vh}
.header{background:linear-gradient(135deg, #e52d27 0%, #b31217 100%);color:#fff;padding:20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
.header h1{font-size:20px;font-weight:900;letter-spacing:1px}
.logout-btn{background:rgba(255,255,255,0.2);color:#fff;border:none;padding:8px 12px;border-radius:8px;font-weight:bold;cursor:pointer}
.container{padding:20px;max-width:600px;margin:0 auto}
.input-group{margin-bottom:15px}
.input-group label{display:block;font-size:13px;font-weight:700;color:#6c757d;margin-bottom:5px}
.input-group input{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;font-size:16px;outline:none}
.btn{width:100%;background:#e52d27;color:#fff;border:none;padding:15px;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer}
.card{background:#fff;border-radius:12px;padding:15px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,0.05);border-left:4px solid #e52d27}
.card h3{font-size:16px;margin-bottom:5px;color:#212529}
.card p{font-size:13px;color:#555;margin-bottom:3px}
.badge{display:inline-block;padding:4px 8px;border-radius:4px;font-size:11px;font-weight:bold;color:#fff;background:#f39c12;margin-bottom:8px}
.status-Delivered{background:#40c057}
.status-Outfordelivery{background:#339af0}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);align-items:center;justify-content:center;padding:20px;z-index:100}
.modal-content{background:#fff;padding:20px;border-radius:16px;width:100%;max-width:400px;text-align:center}
.modal-content input{width:100%;padding:15px;font-size:24px;text-align:center;letter-spacing:10px;border:2px solid #ddd;border-radius:10px;margin:15px 0;outline:none}
.empty{text-align:center;padding:50px 20px;color:#888;font-size:15px}
</style>
</head>
<body>

<div class="header">
  <h1>FAIZ DELIVERY</h1>
  <button class="logout-btn" onclick="logout()" id="logoutBtn" style="display:none">Logout</button>
</div>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="container">
  <div style="text-align:center;margin-bottom:30px">
    <h2 style="color:#e52d27">Delivery Partner Login</h2>
    <p style="color:#777;font-size:14px;margin-top:5px">Apna registered phone number daalein</p>
  </div>
  <div class="input-group">
    <label>Phone Number</label>
    <input type="tel" id="loginPhone" placeholder="10-digit mobile number" maxlength="10">
  </div>
  <button class="btn" onclick="loginDeliveryBoy()">Login</button>
</div>

<!-- DASHBOARD -->
<div id="dashboardScreen" class="container" style="display:none">
  <h3 style="margin-bottom:15px;color:#333">Aapke Assigned Orders</h3>
  <div id="ordersList">
    <div class="empty">Loading orders...</div>
  </div>
</div>

<!-- OTP MODAL -->
<div id="otpModal" class="modal">
  <div class="modal-content">
    <h3 style="color:#333">Verify Delivery</h3>
    <p style="font-size:13px;color:#666;margin-top:5px">Customer se 4-digit OTP lein</p>
    <input type="text" id="otpInput" maxlength="4" placeholder="----">
    <div style="display:flex;gap:10px">
      <button class="btn" style="background:#ddd;color:#333" onclick="closeOtpModal()">Cancel</button>
      <button class="btn" id="verifyBtn" onclick="verifyOtp()">Verify & Deliver</button>
    </div>
    <p id="otpError" style="color:#e52d27;font-size:12px;margin-top:10px;font-weight:bold;display:none"></p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc, serverTimestamp, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Aapka Firebase config
const firebaseConfig={apiKey:"AIzaSyCBLRe3QajETrVTuK-ljrOVndJO9ndZiuU",authDomain:"faiz-fashion.firebaseapp.com",projectId:"faiz-fashion",storageBucket:"faiz-fashion.firebasestorage.app",messagingSenderId:"188226858699",appId:"1:188226858699:web:328e68db2b95b366a1f54e"};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentDeliveryPhone = localStorage.getItem('deliveryPhone') || null;
let unsubOrders = null;
let unsubPreOrders = null;
let pendingOrderId = null;
let pendingOrderType = null;

// Page load hone par check karein agar pehle se login hai
onAuthStateChanged(auth, (user) => {
    if (user) {
        if (currentDeliveryPhone) {
            showDashboard();
        } else {
            showLogin();
        }
    } else {
        // Login nahi hai toh anonymous login karein background mein
        signInAnonymously(auth).catch(err => alert("Firebase Error: " + err.message));
    }
});

function showLogin() {
    document.getElementById('loginScreen').style.display = 'block';
    document.getElementById('dashboardScreen').style.display = 'none';
    document.getElementById('logoutBtn').style.display = 'none';
}

function showDashboard() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboardScreen').style.display = 'block';
    document.getElementById('logoutBtn').style.display = 'block';
    document.getElementById('loginPhone').value = currentDeliveryPhone;
    loadOrders();
}

function loginDeliveryBoy() {
    const phone = document.getElementById('loginPhone').value.trim();
    if (phone.length !== 10) return alert("Enter valid 10-digit number");
    currentDeliveryPhone = phone;
    localStorage.setItem('deliveryPhone', phone);
    showDashboard();
}

function logout() {
    localStorage.removeItem('deliveryPhone');
    currentDeliveryPhone = null;
    if(unsubOrders) unsubOrders();
    if(unsubPreOrders) unsubPreOrders();
    showLogin();
}

// Normal Orders aur Pre-Orders dono ko load karein
function loadOrders() {
    const list = document.getElementById('ordersList');
    list.innerHTML = '<div class="empty">Fetching orders...</div>';
    
    if(unsubOrders) unsubOrders();
    if(unsubPreOrders) unsubPreOrders();

    let normalOrders = [];
    let preOrders = [];

    // 1. Fetch Normal Orders
    const qNormal = query(collection(db, 'orders'), where('deliveryBoy.phone', '==', currentDeliveryPhone));
    unsubOrders = onSnapshot(qNormal, (snap) => {
        normalOrders = snap.docs.map(d => ({id: d.id, type: 'normal', ...d.data()}));
        renderCombinedOrders(normalOrders, preOrders);
    });

    // 2. Fetch Pre-Orders
    const qPre = query(collection(db, 'pre_orders'), where('deliveryBoy.phone', '==', currentDeliveryPhone));
    unsubPreOrders = onSnapshot(qPre, (snap) => {
        preOrders = snap.docs.map(d => ({id: d.id, type: 'pre', ...d.data()}));
        renderCombinedOrders(normalOrders, preOrders);
    });
}

function renderCombinedOrders(normal, pre) {
    const list = document.getElementById('ordersList');
    let allOrders = [...normal, ...pre];
    
    // Sirf active orders dikhayein
    allOrders = allOrders.filter(o => o.status !== 'Delivered' && o.status !== 'Cancelled');

    if (allOrders.length === 0) {
        list.innerHTML = '<div class="empty">🎉 Koi active order nahi hai.</div>';
        return;
    }

    list.innerHTML = allOrders.map(o => {
        const isPre = o.type === 'pre';
        const customerName = isPre ? 'Pre-Order Customer' : (o.customerName || 'Customer');
        const address = isPre ? o.address : ((o.building ? o.building + ', ' : '') + o.address);
        const phone = o.phone;
        const orderIdShow = o.orderCode || o.id.slice(-8).toUpperCase();
        const amount = isPre ? (o.totalPrice || 'TBD') : o.total;
        
        // Map Link
        const mapBtn = (o.latitude && o.longitude) ? 
            `<a href="https://www.google.com/maps?q=${o.latitude},${o.longitude}" target="_blank" style="display:inline-block;background:#40c057;color:#fff;padding:6px 12px;border-radius:6px;text-decoration:none;font-size:12px;font-weight:bold;margin-top:8px">📍 View Location</a>` : '';

        // Verify Button
        const verifyBtn = `<button onclick="openOtpModal('${o.id}', '${o.type}')" style="width:100%;background:#212529;color:#fff;border:none;padding:10px;border-radius:8px;margin-top:10px;font-weight:bold;cursor:pointer">🔐 Verify Delivery OTP</button>`;

        return `
        <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:start">
                <div>
                    <span class="badge" style="background:${isPre ? '#845ef7' : '#339af0'}">${isPre ? 'Pre-Order' : 'Normal'}</span>
                    <h3>#${orderIdShow}</h3>
                </div>
                <strong style="color:#e52d27">₹${amount}</strong>
            </div>
            <p><b>Name:</b> ${customerName}</p>
            <p><b>Phone:</b> <a href="tel:${phone}" style="color:#339af0;font-weight:bold">${phone}</a></p>
            <p><b>Address:</b> ${address}</p>
            ${isPre && o.description ? `<p style="background:#f8f9fa;padding:5px;border-radius:4px;font-size:12px"><b>Note:</b> ${o.description}</p>` : ''}
            ${mapBtn}
            ${verifyBtn}
        </div>`;
    }).join('');
}

// OTP Modal Logic
function openOtpModal(id, type) {
    pendingOrderId = id;
    pendingOrderType = type;
    document.getElementById('otpInput').value = '';
    document.getElementById('otpError').style.display = 'none';
    document.getElementById('otpModal').style.display = 'flex';
}

function closeOtpModal() {
    document.getElementById('otpModal').style.display = 'none';
    pendingOrderId = null;
    pendingOrderType = null;
}

async function verifyOtp() {
    const entered = document.getElementById('otpInput').value.trim();
    const errEl = document.getElementById('otpError');
    const btn = document.getElementById('verifyBtn');
    
    if (entered.length !== 4) {
        errEl.textContent = "4-digit OTP daalein";
        errEl.style.display = 'block';
        return;
    }

    btn.disabled = true;
    btn.textContent = 'Verifying...';
    errEl.style.display = 'none';

    try {
        // Database se order fetch karein taaki OTP match kar sakein
        const collectionName = pendingOrderType === 'pre' ? 'pre_orders' : 'orders';
        const orderRef = doc(db, collectionName, pendingOrderId);
        const orderSnap = await getDocs(query(collection(db, collectionName))); // Simple getDocs to check
        // Actually getting single doc is better:
        const { getDoc } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
        const docSnap = await getDoc(orderRef);
        
        if (!docSnap.exists()) throw new Error("Order not found");
        
        const orderData = docSnap.data();
        
        if (entered !== String(orderData.deliveryOtp)) {
            errEl.textContent = "❌ Galat OTP! Customer se dobara poochein.";
            errEl.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Verify & Deliver';
            return;
        }

        // OTP Sahi hai, update status
        await updateDoc(orderRef, {
            status: 'Delivered',
            deliveredAt: serverTimestamp()
        });

        alert('✅ Order Successfully Delivered!');
        closeOtpModal();
        
    } catch (error) {
        console.error(error);
        errEl.textContent = "Error: " + error.message;
        errEl.style.display = 'block';
    } finally {
        btn.disabled = false;
        btn.textContent = 'Verify & Deliver';
    }
}

// Global expose
window.loginDeliveryBoy = loginDeliveryBoy;
window.logout = logout;
window.openOtpModal = openOtpModal;
window.closeOtpModal = closeOtpModal;
window.verifyOtp = verifyOtp;
</script>
</body>
</html>
